# Render Blueprint Configuration for Pharmacy SaaS Backend API
# Deploys the NestJS + Prisma API connected securely to Neon PostgreSQL over TLS.
# Never put actual database passwords or secrets in this file.

services:
  - type: web
    name: pharmacy-saas-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:api
    startCommand: npm run start:api:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.1
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false # Set securely in Render Dashboard (Neon PostgreSQL connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://pharmacy-65783.web.app,https://pharmacy-65783.firebaseapp.com,http://localhost:4200,http://localhost:8100
      - key: DB_CONNECT_TIMEOUT_MS
        value: "15000"
      - key: DB_TRANSACTION_TIMEOUT_MS
        value: "15000"
      - key: DB_MAX_WAIT_MS
        value: "5000"

