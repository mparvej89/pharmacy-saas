# Docker Compose for Pharmacy SaaS Local Development
# Connects to your Neon PostgreSQL database (`pharmacy_db`) via DATABASE_URL in .env
# Optional: Run `docker compose --profile local-db up` if you also want an isolated local PostgreSQL container.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pharmacy-saas-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-local:
    image: postgres:17-alpine
    container_name: pharmacy-saas-postgres-local
    profiles:
      - local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmacy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pharmacy_pgdata:/var/lib/postgresql/data

volumes:
  pharmacy_pgdata:

